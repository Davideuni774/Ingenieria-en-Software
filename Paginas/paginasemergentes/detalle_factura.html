<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Detalle de Factura - FacturaSmart</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		body {
			background: #f3f5fb;
			color: #1f2933;
		}

		.app {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.content {
			max-width: 1120px;
			margin: 0 auto;
			padding: 24px 20px 40px;
			width: 100%;
		}

		.card {
			background: #fff;
			border-radius: 14px;
			box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
			padding: 18px 20px;
			margin-bottom: 16px;
		}

		.section-title {
			font-size: 1.2rem;
			font-weight: 600;
			color: #102a43;
			margin-bottom: 12px;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 12px;
		}

		.field label {
			display: block;
			font-size: 0.8rem;
			color: #6b7785;
			margin-bottom: 6px;
		}

		.field input {
			width: 100%;
			padding: 10px;
			border: 1px solid #d8e2ec;
			border-radius: 8px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			padding: 10px;
			border-bottom: 1px solid #eef2f7;
			text-align: left;
		}

		th {
			font-size: 0.8rem;
			color: #6b7785;
			text-transform: uppercase;
		}

		td input {
			width: 100%;
			padding: 8px;
			border: 1px solid #d8e2ec;
			border-radius: 8px;
		}

		.actions {
			display: flex;
			gap: 10px;
			justify-content: flex-end;
			margin-top: 12px;
			flex-wrap: wrap;
		}

		.btn {
			border: none;
			border-radius: 999px;
			padding: 10px 18px;
			font-weight: 600;
			cursor: pointer;
		}

		.btn-primary {
			background: #17a34a;
			color: #fff;
		}

		.btn-secondary {
			background: #e5edff;
			color: #1d4ed8;
		}

		.btn-danger {
			background: #ef4444;
			color: #fff;
		}

		#status-message {
			margin-bottom: 12px;
			font-size: 0.9rem;
		}

		@media (max-width: 900px) {
			.grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>

<body>
	<div class="app">
		<main class="content">
			<div id="status-message">Cargando detalle de la factura...</div>

			<section class="card">
				<h2 class="section-title">Datos de Factura</h2>
				<div class="grid">
					<div class="field">
						<label>Emisor</label>
						<input id="emisor" type="text" />
					</div>
					<div class="field">
						<label>NIT</label>
						<input id="nit" type="text" />
					</div>
					<div class="field">
						<label>Número Factura</label>
						<input id="numero_factura" type="text" />
					</div>
					<div class="field">
						<label>Fecha</label>
						<input id="fecha" type="date" />
					</div>
					<div class="field">
						<label>Subtotal</label>
						<input id="subtotal" type="number" step="0.01" />
					</div>
					<div class="field">
						<label>IVA</label>
						<input id="iva" type="number" step="0.01" />
					</div>
					<div class="field">
						<label>Total</label>
						<input id="total" type="number" step="0.01" />
					</div>
					<div class="field">
						<label>Archivo PDF</label>
						<input id="pdf_nombre" type="text" disabled />
					</div>
				</div>
			</section>

			<section class="card">
				<h2 class="section-title">Items de Factura</h2>
				<table>
					<thead>
						<tr>
							<th>Descripción</th>
							<th>Cantidad</th>
							<th>Precio Unitario</th>
							<th>Total</th>
							<th>Acción</th>
						</tr>
					</thead>
					<tbody id="items-body"></tbody>
				</table>
				<div class="actions">
					<button class="btn btn-secondary" id="add-item-btn" type="button">+ Agregar Item</button>
				</div>
			</section>

			<div class="actions">
				<button class="btn btn-secondary" type="button" onclick="window.location.href='historial_facturas.html'">Volver</button>
				<button class="btn btn-primary" id="save-btn" type="button">Guardar Cambios</button>
			</div>
		</main>
	</div>

	<script src="inicio.js"></script>
	<script src="detalle_factura.js"></script>
</body>

</html>
