<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Smart - Iniciar Sesión</title>
    <link rel="stylesheet" href="index.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Contenedor principal -->
    <div class="main-container">
        <div class="background-area" style="background-image: url('https://i.imgur.com/5l2rNsM.png');"></div>
        
        <!-- Contenedor del formulario -->
        <div class="form-container">
            <!-- Logo - AQUÍ PUEDES CAMBIAR EL LOGO -->
            <div class="logo-container">
                <div class="logo-placeholder">
                    <img src="https://i.imgur.com/qlfEJ79.png" alt="Factura Smart Logo">
                </div>
            </div>
            
            <!-- Título -->
            <h2 class="form-title">Iniciar Sesión</h2>
            
            <!-- Formulario de login -->
            <form class="login-form" id="loginForm">
                <!-- Campo de correo electrónico -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Correo Electrónico" required>
                    </div>
                </div>
                
                <!-- Campo de contraseña -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Contraseña" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Opciones adicionales -->
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                
                <!-- Botón de iniciar sesión -->
                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </form>
            
            <!-- Registro -->
            <p class="register-text">
                ¿No tienes una cuenta? <a href="Paginas/registronuevascuentas.html" class="register-link">Regístrate</a>
            </p>
            
            <!-- Separador -->
            <div class="separator">
                <span>o</span>
            </div>
            
            <!-- Botones de redes sociales -->
            <div class="social-buttons">
                <button class="social-btn facebook-btn" onclick="loginWithFacebook()">
                    <i class="fab fa-facebook-f"></i>
                    Ingresar con Facebook
                </button>
                
                <button class="social-btn google-btn" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i>
                    Ingresar con Google
                </button>
                
                <button class="social-btn apple-btn" onclick="loginWithApple()">
                    <i class="fab fa-apple"></i>
                    Ingresar con Apple
                </button>
            </div>
            
            <!-- Links legales -->
            <div class="legal-links">
                <a href="Paginas/privacidad.html">Política de Privacidad</a>
                <a href="Paginas/terminos.html">Términos y Condiciones</a>
            </div>
        </div>
    </div>
    
    <!-- Script para funcionalidades -->
    <script src="index.js"></script>
</body>
</html>
